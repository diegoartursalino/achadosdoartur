<meta name="description" content="Achados do Artur: achadinhos da Shopee com preço bom.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style id="vitrine-style">
/* Layout: coluna estreita estilo "link na bio", grade 2 colunas de produtos com etiqueta de preço */
:root{
  --bg:#EEF1EC;--surface:#FFFFFF;--ink:#15211C;--muted:#56655E;--line:#D3DBD5;
  --tag:#FFC93C;--tag-ink:#2A1E00;--go:#0B6E5A;--go-ink:#FFFFFF;--soft:#E2E8E3;--danger:#B3261E;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1412;--surface:#172019;--ink:#E8EEE9;--muted:#9AA9A1;--line:#2A3630;
  --tag:#FFC93C;--tag-ink:#2A1E00;--go:#35B795;--go-ink:#03130D;--soft:#1F2A24;--danger:#FF8A80;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412;--surface:#172019;--ink:#E8EEE9;--muted:#9AA9A1;--line:#2A3630;
  --tag:#FFC93C;--tag-ink:#2A1E00;--go:#35B795;--go-ink:#03130D;--soft:#1F2A24;--danger:#FF8A80;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 96px;display:flex;flex-direction:column;gap:22px}
header.top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--tag);color:var(--tag-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}
.handle{font-weight:600;color:var(--go);font-size:14px}
.bio{color:var(--muted);max-width:36ch;margin:0;text-wrap:balance}
.search{position:relative}
.search input{width:100%;font:inherit;padding:13px 16px 13px 42px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--go)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin:-12px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin:0 -4px;padding-inline:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-weight:600;font-size:13.5px;padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.card a:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0;border:1px solid var(--line)}
.pic{position:relative;aspect-ratio:1/1;max-width:100%;background:var(--soft);display:grid;place-items:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.ph{font-family:var(--display);font-weight:800;font-size:44px;color:var(--muted);opacity:.45;letter-spacing:-.03em}
.num{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.flag{position:absolute;top:8px;right:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--surface);color:var(--muted)}
.flag.hot{background:var(--go);color:var(--go-ink)}
.info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.name{font-weight:600;font-size:14.5px;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.prices{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}
.tag{position:relative;background:var(--tag);color:var(--tag-ink);font-weight:800;font-family:var(--display);font-size:16px;padding:4px 10px 4px 18px;border-radius:4px 8px 8px 4px;font-variant-numeric:tabular-nums;clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%)}
.tag::before{content:"";position:absolute;left:8px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--surface)}
.old{font-size:12.5px;color:var(--muted);text-decoration:line-through;font-variant-numeric:tabular-nums}
.card a.go{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:14px;padding:10px;border-radius:10px;background:var(--go);color:var(--go-ink)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:32px 8px;border:1.5px dashed var(--line);border-radius:16px}
footer.note{font-size:12.5px;color:var(--muted);text-align:center;max-width:44ch;margin:0 auto}
/* edição */
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:11px 18px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.small{padding:7px 12px;font-size:13px}
.btn.warn{border-color:var(--danger);color:var(--danger);background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,16,13,.55);display:flex;justify-content:center;align-items:flex-end}
.panel{background:var(--bg);width:100%;max-width:600px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.panel-head h2{font-family:var(--display);font-size:20px;margin:0}
.panel-body{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.panel-foot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.status{font-size:13px;color:var(--muted)}
.sec-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600}
.field input[type=text],.field input[type=url]{font:inherit;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.field input:focus{outline:none;border-color:var(--go)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.photo{display:flex;gap:12px;align-items:center}
.photo .pv{width:64px;height:64px;border-radius:10px;background:var(--soft);overflow:hidden;flex:none;display:grid;place-items:center;color:var(--muted);font-size:11px}
.photo .pv img{width:100%;height:100%;object-fit:cover}
.err{color:var(--danger);font-size:13px;margin:0}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.prow .n{font-weight:700;font-size:12px;background:var(--soft);padding:3px 7px;border-radius:6px;font-variant-numeric:tabular-nums}

function iniciais(n){var p=(n||'').trim().split(/\s+/);return((p[0]||'')[0]||'V').toUpperCase()+(p[1]?p[1][0].toUpperCase():'')}
function pad(n){return n<10?'0'+n:''+n}
function cats(){var s=[];state.produtos.forEach(function(p){if(p.cat&&s.indexOf(p.cat)<0)s.push(p.cat)});return s}
function lista(){
  var q=busca.trim().toLowerCase().replace(/^#/,'');
  var arr=state.produtos.filter(function(p){
    if(filtro!=='Todos'&&p.cat!==filtro)return false;
    if(!q)return true;
    if(/^\d+$/.test(q))return p.n===parseInt(q,10);
    return (p.nome+' '+p.cat).toLowerCase().indexOf(q)>=0;
  });
  return arr.sort(function(a,b){return (b.destaque?1:0)-(a.destaque?1:0)||b.n-a.n});
}
function card(p){
  var pic=p.img?'<img src="'+imgSrc(p.img)+'" alt="'+esc(p.nome)+'" loading="lazy" onerror="this.remove()">':'';
  var flag=p.exemplo?'<span class="flag">Exemplo</span>':(p.destaque?'<span class="flag hot">Destaque</span>':'');
  return '<article class="card"><div class="pic"><span class="ph" aria-hidden="true">'+esc(iniciais(p.nome))+'</span>'+pic.replace('<img','<img style="position:absolute;inset:0"')+'<span class="num">#'+pad(p.n)+'</span>'+flag+'</div>'+

}

    '<div class="field"><label for="l-nome">Nome da vitrine</label><input id="l-nome" type="text" value="'+esc(L.nome)+'"></div>'+
    '<div class="field"><label for="l-handle">Seu @ no Instagram</label><input id="l-handle" type="text" value="'+esc(L.handle)+'"></div>'+
    '<div class="field"><label for="l-frase">Frase de apresentação</label><input id="l-frase" type="text" value="'+esc(L.frase)+'"></div>'+
    '<div class="photo"><div class="pv">'+(L.avatar?'<img src="'+imgSrc(L.avatar)+'" alt="">':'Sem foto')+'</div><div class="field"><label for="l-foto">Foto de perfil</label><input id="l-foto" type="file" accept="image/*"></div></div></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><p class="sec-title">Produtos ('+state.produtos.length+')</p><button class="btn small" id="novo">+ Adicionar produto</button></div>'+
    '<div class="plist">'+state.produtos.slice().sort(function(a,b){return b.n-a.n}).map(function(p){
      var del=confirmDel===p.n;
      return '<div class="prow"><span class="n">#'+pad(p.n)+'</span><span class="t">'+esc(p.nome)+(p.exemplo?' · exemplo':'')+'</span><span class="acts">'+
        (del?'<button class="btn warn small" data-delok="'+p.n+'">Confirmar</button><button class="btn ghost small" data-delno="1">Não</button>':
        '<button class="btn ghost small" data-edit="'+p.n+'">Editar</button><button class="btn warn small" data-del="'+p.n+'">Apagar</button>')+'</span></div>'}).join('')+
    (state.produtos.some(function(p){return p.exemplo})?'<button class="btn warn small" id="limpar" style="align-self:flex-start">Apagar todos os exemplos</button>':'')+
    '</div></div>'+rodape()+'</div></div>';
  }
  var p=editing==='novo'?{n:state.proximo,nome:'',cat:'',preco:'',antigo:'',link:'',img:null,destaque:false}:state.produtos.filter(function(x){return x.n===editing})[0];
  var img=pendingImg!==undefined?pendingImg:p.img;
  return '<div class="sheet"><div class="panel" role="dialog" aria-label="Produto"><div class="panel-head"><h2>'+(editing==='novo'?'Novo produto':'Produto #'+pad(p.n))+'</h2><button class="btn ghost small" id="voltar">Voltar</button></div><div class="panel-body"><div class="box">'+
    '<div class="photo"><div class="pv" id="pv">'+(img?'<img src="'+imgSrc(img)+'" alt="">':'Sem foto')+'</div><div class="field"><label for="p-foto">Foto do produto</label><input id="p-foto" type="file" accept="image/*"></div></div>'+
    '<div class="field"><label for="p-nome">Nome do produto</label><input id="p-nome" type="text" value="'+esc(p.nome)+'" placeholder="Ex: Suporte de celular para bike"></div>'+
    '<div class="field"><label for="p-cat">Categoria</label><input id="p-cat" type="text" list="p-cats" value="'+esc(p.cat)+'" placeholder="Ex: Casa, Tech, Bike"><datalist id="p-cats">'+cats().map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist></div>'+
    '<div class="row2"><div class="field"><label for="p-preco">Preço</label><input id="p-preco" type="text" value="'+esc(p.preco)+'" placeholder="R$ 29,90"></div><div class="field"><label for="p-antigo">Preço antigo (opcional)</label><input id="p-antigo" type="text" value="'+esc(p.antigo)+'" placeholder="R$ 49,90"></div></div>'+
    '<div class="field"><label for="p-link">Link de afiliado da Shopee</label><input id="p-link" type="url" value="'+esc(p.exemplo?'':p.link)+'" placeholder="https://s.shopee.com.br/..."></div>'+
    '<label class="check"><input id="p-dest" type="checkbox"'+(p.destaque?' checked':'')+'> Mostrar em destaque no topo</label>'+
    '<p class="err" id="p-err" hidden></p><button class="btn" id="ok">'+(editing==='novo'?'Adicionar à vitrine':'Salvar produto')+'</button></div></div>'+rodape()+'</div></div>';
}
function rodape(){
  return '<div class="panel-foot"><span class="status" id="status">'+esc(msg||(dirty?'Você tem alterações não publicadas.':'Tudo publicado.'))+'</span><button class="btn" id="publicar"'+(!dirty||saving?' disabled':'')+'>'+(saving?'Publicando…':'Publicar alterações')+'</button></div>';
}
function setStatus(t){msg=t;var s=document.getElementById('status');if(s)s.textContent=t}
function lerLoja(){
  var n=document.getElementById('l-nome');if(!n)return;
  var L=state.loja,nv={nome:n.value.trim()||'Minha Vitrine',handle:document.getElementById('l-handle').value.trim(),frase:document.getElementById('l-frase').value.trim()};
  if(nv.nome!==L.nome||nv.handle!==L.handle||nv.frase!==L.frase){L.nome=nv.nome;L.handle=nv.handle;L.frase=nv.frase;dirty=true}
}
function reduzir(file){
  return new Promise(function(res){
    if(!window.createImageBitmap){res(file);return}
    createImageBitmap(file).then(function(bm){
      var max=900,s=Math.min(1,max/Math.max(bm.width,bm.height));
      var c=document.createElement('canvas');c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);
      c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
      c.toBlob(function(b){res(b&&b.size<file.size?b:file)},'image/webp',0.85);
    }).catch(function(){res(file)});
  });
}
function enviarFoto(file,cb){
  if(!assetsNs){setStatus('Envio de fotos indisponível nesta tela.');return}
  setStatus('Enviando foto…');
  reduzir(file).then(function(b){
    var t=b.type&&/^image\/(png|jpeg|gif|webp)$/.test(b.type)?b.type:'image/jpeg';
    return assetsNs.upload(b,{type:t});
  }).then(function(r){setStatus('Foto enviada.');cb(r.id)}).catch(function(e){
    var c=e&&e.code;setStatus(c==='too_large'?'Foto muito grande. Use uma imagem menor que 20 MB.':c==='unsupported_type'?'Formato não aceito. Use JPG, PNG ou WEBP.':'Não foi possível enviar a foto. Tente de novo.');
  });
}
var SKEL_A='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
function montarDoc(){
  var css=document.getElementById('vitrine-style').outerHTML,js=document.getElementById('vitrine-js').outerHTML;
  var dados=JSON.stringify(state).replace(/</g,'\\u003c');
  return SKEL_A+'<title>Achados do Artur</title>\n<meta name="description" content="Achados do Artur: achadinhos da Shopee com preço bom.">\n<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">\n'+css+'\n<div id="app"></div>\n<script type="application/json" id="vitrine-data">'+dados+'<\/script>\n'+js+'</body></html>';
}
function publicar(){
  lerLoja();if(!dirty||saving)return;
  saving=true;setStatus('Publicando…');render();
  artifactNs.publish(montarDoc()).then(function(){dirty=false;saving=false;setStatus('Publicado! Atualizando…')}).catch(function(e){
    saving=false;var c=e&&e.code;
    if(c==='conflict'){setStatus('A página foi atualizada em outro lugar. Recarregando a versão mais nova…')}
    else if(c==='not_writer'||c==='not_granted'||c==='consent_required'){canEdit=false;editing=null;setStatus('')}
    else if(c==='rate_limited'){setStatus('Muitas publicações seguidas. Espere um minuto e publique de novo.')}
    else if(c==='too_large'){setStatus('A vitrine ficou grande demais para publicar.')}
    else{setStatus('Não foi possível publicar agora. Tente de novo em instantes.')}
    render();
  });
}
app.addEventListener('input',function(e){
  if(e.target.id==='busca'){busca=e.target.value;var g=app.querySelector('.grid');var it=lista();g.innerHTML=it.length?it.map(card).join(''):'<p class="empty">Nenhum produto encontrado. Tente outra busca ou categoria.</p>'}
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='l-foto'&&t.files[0]){enviarFoto(t.files[0],function(id){lerLoja();state.loja.avatar=id;dirty=true;msg='';render()})}
  if(t.id==='p-foto'&&t.files[0]){enviarFoto(t.files[0],function(id){pendingImg=id;var pv=document.getElementById('pv');if(pv)pv.innerHTML='<img src="'+imgSrc(id)+'" alt="">'})}
  if(['l-nome','l-handle','l-frase'].indexOf(t.id)>=0){lerLoja();var b=document.getElementById('publicar');if(b&&dirty)b.disabled=false;setStatus('Você tem alterações não publicadas.')}
});
app.addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.cat){filtro=t.dataset.cat;render();return}
  if(t.id==='abrir'){editing='lista';msg='';render();return}
  if(t.id==='fechar'){lerLoja();editing=null;confirmDel=null;render();return}
  if(t.id==='novo'){lerLoja();editing='novo';pendingImg=undefined;render();return}
  if(t.dataset.edit){lerLoja();editing=parseInt(t.dataset.edit,10);pendingImg=undefined;render();return}
  if(t.id==='voltar'){editing='lista';pendingImg=undefined;render();return}
  if(t.dataset.del){lerLoja();confirmDel=parseInt(t.dataset.del,10);render();return}
  if(t.dataset.delno){confirmDel=null;render();return}
  if(t.dataset.delok){var n=parseInt(t.dataset.delok,10);state.produtos=state.produtos.filter(function(p){return p.n!==n});confirmDel=null;dirty=true;msg='';render();return}
  if(t.id==='limpar'){lerLoja();state.produtos=state.produtos.filter(function(p){return !p.exemplo});dirty=true;msg='';render();return}
  if(t.id==='publicar'){publicar();return}
  if(t.id==='ok'){
    var v=function(id){return document.getElementById(id).value.trim()};
    var nome=v('p-nome'),link=v('p-link'),err=document.getElementById('p-err');
    if(!nome){err.textContent='Escreva o nome do produto.';err.hidden=false;return}
    if(!/^https:\/\//i.test(link)){err.textContent='Cole o link de afiliado completo, começando com https://';err.hidden=false;return}
    var dados={nome:nome,cat:v('p-cat')||'Achados',preco:v('p-preco'),antigo:v('p-antigo'),link:link,destaque:document.getElementById('p-dest').checked,exemplo:false};
    if(editing==='novo'){dados.n=state.proximo;state.proximo++;dados.img=pendingImg||null;state.produtos.push(dados)}
    else{var p=state.produtos.filter(function(x){return x.n===editing})[0];Object.assign(p,dados);if(pendingImg!==undefined)p.img=pendingImg}
    pendingImg=undefined;dirty=true;editing='lista';msg='Produto salvo. Toque em Publicar para colocar no ar.';render();return}
});
render();
function ligar(){
  window.claude.use('user').then(function(u){
    if(!u)return false;
    try{return Promise.resolve(u.canEdit())}catch(_){return false}
  }).then(function(ok){
    if(!ok)return;
    return window.claude.use('artifact').then(function(a){
      if(!a)return;artifactNs=a;
      return window.claude.use('assets').then(function(s){assetsNs=s;canEdit=true;render()});
    });
  }).catch(function(){});
}
var tent=0;(function esperar(){if(window.claude&&window.claude.use){ligar()}else if(tent++<30){setTimeout(esperar,150)}})();
})();
</script>
</body></html>
